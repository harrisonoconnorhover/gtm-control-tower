name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run check:secrets
      - run: npm run audit
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke:fresh-install
