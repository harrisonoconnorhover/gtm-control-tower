name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run check:secrets
      - run: npm run audit
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run build:public
      - name: Check browser CSV workflows
        timeout-minutes: 5
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          CONTROL_TOWER_BROWSER_BASE_URL: http://127.0.0.1:4175
        run: |
          node node_modules/vite/bin/vite.js preview --config vite.public.config.ts --host 127.0.0.1 --port 4175 --strictPort > "$RUNNER_TEMP/browser-csv-preview.log" 2>&1 &
          csv_preview_pid=$!
          trap 'kill "$csv_preview_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 40 --max-time 2 "$CONTROL_TOWER_BROWSER_BASE_URL" > /dev/null
          npm run test:browser-csv
          npm run test:browser-csv-related
          npm run test:browser-csv-keyboard
      - run: npm run smoke:fresh-install
