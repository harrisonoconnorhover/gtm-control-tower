version: 2

sources:
  - name: crm
    database: "{{ env_var('GOOGLE_CLOUD_PROJECT') }}"
    schema: gtm_control_tower
    tables:
      - name: raw_crm_events
        description: Synthetic lifecycle events emitted by the n8n routing workflow.
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 6, period: hour}
