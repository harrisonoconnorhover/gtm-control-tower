services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${CONTROL_TOWER_BIND:-127.0.0.1}:${CONTROL_TOWER_PORT:-3000}:3000"
    environment:
      CONTROL_TOWER_PERSISTENCE_ENABLED: "true"
      CONTROL_TOWER_SYNC_KEY: ${CONTROL_TOWER_SYNC_KEY:-}
      CONTROL_TOWER_POMADE_API_URL: ${CONTROL_TOWER_POMADE_API_URL:-}
      CONTROL_TOWER_POMADE_API_KEY: ${CONTROL_TOWER_POMADE_API_KEY:-}
      CONTROL_TOWER_POMADE_PUBLIC_URL: ${CONTROL_TOWER_POMADE_PUBLIC_URL:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      N8N_FUNKY_WEBHOOK_URL: ${N8N_FUNKY_WEBHOOK_URL:-}
      N8N_GOOGLE_SHEETS_READ_WEBHOOK_URL: ${N8N_GOOGLE_SHEETS_READ_WEBHOOK_URL:-}
      N8N_GOOGLE_SHEETS_WRITE_WEBHOOK_URL: ${N8N_GOOGLE_SHEETS_WRITE_WEBHOOK_URL:-}
      N8N_HUBSPOT_SYNC_WEBHOOK_URL: ${N8N_HUBSPOT_SYNC_WEBHOOK_URL:-}
      N8N_HUBSPOT_SOURCE_WEBHOOK_URL: ${N8N_HUBSPOT_SOURCE_WEBHOOK_URL:-}
      N8N_REPAIR_WEBHOOK_URL: ${N8N_REPAIR_WEBHOOK_URL:-}
      N8N_STATE_WEBHOOK_URL: ${N8N_STATE_WEBHOOK_URL:-}
      SALESFORCE_ACCESS_TOKEN: ${SALESFORCE_ACCESS_TOKEN:-}
      SALESFORCE_API_VERSION: ${SALESFORCE_API_VERSION:-67.0}
      SALESFORCE_INSTANCE_URL: ${SALESFORCE_INSTANCE_URL:-}
      CONTROL_TOWER_SLACK_WEBHOOK_URL: ${CONTROL_TOWER_SLACK_WEBHOOK_URL:-}
      CONTROL_TOWER_APP_URL: ${CONTROL_TOWER_APP_URL:-}
      CONTROL_TOWER_INVESTIGATOR_KEY: ${CONTROL_TOWER_INVESTIGATOR_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONTROL_TOWER_INVESTIGATION_MODEL: ${CONTROL_TOWER_INVESTIGATION_MODEL:-}
      HUBSPOT_MONITOR_CLIENT_SECRET: ${HUBSPOT_MONITOR_CLIENT_SECRET:-}
      HUBSPOT_MONITOR_PORTAL_ID: ${HUBSPOT_MONITOR_PORTAL_ID:-}
      HUBSPOT_MONITOR_WEBHOOK_URL: ${HUBSPOT_MONITOR_WEBHOOK_URL:-}
      SALESFORCE_MONITOR_ORG_ID: ${SALESFORCE_MONITOR_ORG_ID:-}
      CONTROL_TOWER_CDC_RELAY_SECRET: ${CONTROL_TOWER_CDC_RELAY_SECRET:-}
    volumes:
      - ${CONTROL_TOWER_SQLITE_DIR:-./.runtime/sqlite}:/app/.runtime/sqlite

  monitor:
    profiles: [monitor]
    build:
      context: .
    command: [node, /app/scripts/monitor.mjs]
    restart: unless-stopped
    depends_on: [app]
    environment:
      CONTROL_TOWER_MONITOR_URL: http://app:3000
      CONTROL_TOWER_SYNC_KEY: ${CONTROL_TOWER_SYNC_KEY:-}
      CONTROL_TOWER_MONITOR_PROVIDERS: ${CONTROL_TOWER_MONITOR_PROVIDERS:-hubspot}

  salesforce-cdc:
    profiles: [cdc]
    build:
      context: .
    command: [node, /app/scripts/subscribe-salesforce-cdc.mjs]
    restart: unless-stopped
    depends_on: [app]
    environment:
      SALESFORCE_INSTANCE_URL: ${SALESFORCE_INSTANCE_URL:-}
      SALESFORCE_ACCESS_TOKEN: ${SALESFORCE_ACCESS_TOKEN:-}
      SALESFORCE_API_VERSION: ${SALESFORCE_API_VERSION:-67.0}
      SALESFORCE_MONITOR_ORG_ID: ${SALESFORCE_MONITOR_ORG_ID:-}
      SALESFORCE_CDC_CHANNEL: ${SALESFORCE_CDC_CHANNEL:-/data/ChangeEvents}
      SALESFORCE_CDC_CHECKPOINT_PATH: /app/.runtime/salesforce-cdc/checkpoint.json
      CONTROL_TOWER_CDC_RELAY_URL: http://app:3000/api/control-tower/events/salesforce
      CONTROL_TOWER_CDC_RELAY_SECRET: ${CONTROL_TOWER_CDC_RELAY_SECRET:-}
    volumes:
      - ${CONTROL_TOWER_CDC_STATE_DIR:-./.runtime/salesforce-cdc}:/app/.runtime/salesforce-cdc

  n8n:
    image: n8nio/n8n@sha256:14c4285bc3034dc5b51034aea393711d27053588e460722bce523453a626f23c
    restart: unless-stopped
    ports:
      - "${N8N_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Serialize production webhooks so two Sheets upserts cannot race while
      # deciding whether a new normalized email should append or update.
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: 0.0.0.0
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      TZ: ${GENERIC_TIMEZONE:-UTC}
    volumes:
      - ${N8N_DATA_DIR:-./.runtime/n8n}:/home/node/.n8n
